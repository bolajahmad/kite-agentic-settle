"""
AA Wallet: Derived from EOA via GokiteAASDK.
Each user may have one or more AA wallets if they interact across different networks.
Tracked via IdentityRegistry.AgentWalletSet events.
"""
type AAWallet @entity(immutable: false) {
  id: ID! # aaWalletAddress-chainId or similar
  address: Bytes!
  owner: User!
  indexed: Boolean! # Whether dynamic ClientVault template is already created
  agents: [Agent!]! @derivedFrom(field: "aaWallet")
  sessions: [Session!]! @derivedFrom(field: "aaWallet")
  createdAt: BigInt!
}

type Agent @entity(immutable: false) {
  id: ID! # agentId as hex
  agentId: BigInt!
  metadata: String
  owner: User!
  aaWallet: AAWallet # The AA wallet contract where this agent's funds live
  
  active: Boolean!
  sessions: [Session!]! @derivedFrom(field: "agent")
  attestations: [Attestation!]! @derivedFrom(field: "agent")

  reputationScore: BigInt # Aggregate reputation (calculated from attestations)
  feedbackCount: BigInt! # Total feedback count
  
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Session @entity(immutable: false) {
  id: ID! # sessionKey address as hex
  sessionKey: Bytes!
  sessionId: Bytes! # keccak256(abi.encodePacked(sessionKey, agentId, validUntil))
  user: User!
  agent: Agent!
  aaWallet: AAWallet # The AA wallet contract this session uses for payments

  validUntil: BigInt!
  valueLimit: BigInt! # Per-transaction limit in USDT
  maxLimit: BigInt! # Total session budget in USDT
  
  status: String! # "ACTIVE", "REVOKED", "EXPIRED"
  blockedAgents: [BigInt!] # agentIds blocked from using this session
  
  payments: [Payment!]! @derivedFrom(field: "session")
  channels: [Channel!]! @derivedFrom(field: "session")
  
  createdAt: BigInt!
  updatedAt: BigInt!
}

"""
Lookup from on-chain sessionId (bytes32) to Session entity (id=sessionKey hex).
Used by ClientVault TransferExecuted(sessionId, ...) dynamic mappings.
"""
type SessionIndex @entity(immutable: false) {
  id: ID! # sessionId as hex
  session: Session!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type User @entity(immutable: false) {
  id: ID! # EOA address as hex
  address: Bytes! # EOA address
  
  aaWallets: [AAWallet!]! @derivedFrom(field: "owner")
  agents: [Agent!]! @derivedFrom(field: "owner")
  sessions: [Session!]! @derivedFrom(field: "user")
  
  totalChannelsOpened: BigInt! # Total number of payment channels
  totalSpent: BigInt! # Total spent across all channels
  totalRefunded: BigInt! # Total refunded
  
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Payment @entity(immutable: false) {
  id: ID!
  session: Session!
  agent: Agent!
  user: User!
  channel: Channel # May be null for per-call payments
  
  recipient: Bytes! # Provider receiving the payment
  token: Bytes!
  amount: BigInt!
  nonce: BigInt
  change: BigInt # Refund amount if any
  
  timestamp: BigInt!
  txHash: Bytes!
  type: String! # "PerCall" | "Channel"
}

type Channel @entity(immutable: false) {
  id: ID! # channelId as hex
  channelId: Bytes!
  
  user: User!
  provider: Bytes! # Service provider address
  agent: Agent!
  session: Session!
  aaWallet: AAWallet! # The AA wallet contract where funds are locked
  
  mode: String! # "PREPAID" | "POSTPAID"
  token: Bytes!
  deposit: BigInt!
  maxSpend: BigInt!
  maxPerCall: BigInt!
  
  status: String! # "OPEN", "ACTIVE", "SETTLEMENT_PENDING", "CLOSED"
  openedAt: BigInt!
  expiresAt: BigInt!
  closedAt: BigInt
  
  settlementDeadline: BigInt
  highestClaimedCost: BigInt
  highestSequenceNumber: BigInt
  settledAmount: BigInt!
  refundAmount: BigInt!
  
  usageMerkleRoot: Bytes
  receipts: [Receipt!]! @derivedFrom(field: "channel")
  payments: [Payment!]! @derivedFrom(field: "channel")
  
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Receipt @entity(immutable: false) {
  id: ID!
  channel: Channel!
  
  sequenceNumber: BigInt!
  cumulativeCost: BigInt!
  timestamp: BigInt!
  
  submitter: Bytes!
  txHash: Bytes!
  createdAt: BigInt!
}

type ChannelSettlement @entity(immutable: false) {
  id: ID! # channelId
  channel: Channel!
  
  payment: BigInt!
  refund: BigInt!
  usageMerkleRoot: Bytes!
  
  txHash: Bytes!
  finalizedAt: BigInt!
}

"""
Attestation: Reputation feedback given by one user/entity about an agent.
Tracked via AttestationRegistry.FeedbackGiven events.
"""
type Attestation @entity(immutable: false) {
  id: ID! # agentId-giver-feedbackIndex
  agent: Agent!
  giver: Bytes! # Address that gave the feedback
  
  feedbackIndex: BigInt!
  value: BigInt! # Reputation value (scaled by valueDecimals)
  valueDecimals: Int! # Decimal scale (e.g., 2 = percentage)
  tag1: String # Reputation category/tag
  tag2: String # Additional tag
  
  status: String! # "ACTIVE", "REVOKED"
  responseHash: Bytes # Hash of agent's response if any
  
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Validation: Third-party validation request/response for agent reputation.
Tracked via AttestationRegistry.ValidationRequested/ValidationResponded events.
"""
type Validation @entity(immutable: false) {
  id: ID! # requestKey as hex
  requestKey: Bytes!
  
  agent: Agent!
  validator: Bytes! # Validator address
  requestHash: Bytes!
  
  response: Int # 0=No, 1=Yes, 2=Abstain
  responseTag: String # Validator's tag/comment
  
  status: String! # "PENDING", "RESPONDED"
  
  requestedAt: BigInt!
  respondedAt: BigInt
  txHash: Bytes!
}

"""
MerkleRoot: Anchored proofs for agent performance/usage.
Tracked via AttestationRegistry.MerkleRootAnchored events.
"""
type MerkleRoot @entity(immutable: false) {
  id: ID! # agentId-merkleRoot
  agent: Agent!
  merkleRoot: Bytes!
  
  logCount: BigInt! # Number of logs in the merkle tree
  ipfsURI: String # Link to off-chain data
  validator: Bytes! # Address that anchored this root
  
  anchoredAt: BigInt!
  txHash: Bytes!
}
