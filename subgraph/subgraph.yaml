specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: IdentityRegistry
    network: kite-ai-testnet
    source:
      address: "0x986A171fd6CE1Dc89d104E2b2a424Df9d4ef7524"
      abi: IdentityRegistry
      startBlock: 21096127
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
        - Session
        - User
        - AAWallet
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistryABI.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleAgentRegistered
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
        - event: AgentWalletSet(indexed uint256,indexed address,indexed address)
          handler: handleAgentWalletSet
        - event: SessionRegistered(indexed uint256,indexed address,indexed address,address,uint256)
          handler: handleSessionRegistered
        - event: SessionRevoked(indexed uint256,indexed address)
          handler: handleSessionRevoked
      file: ./src/identity-registry.ts

  - kind: ethereum
    name: PaymentChannel
    network: kite-ai-testnet
    source:
      address: "0xa00dDA4C326e045aF948cc1dD45A464c09db3Af8"
      abi: PaymentChannel
      startBlock: 21096127
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Channel
        - Receipt
        - Payment
        - User
        - AAWallet
      abis:
        - name: PaymentChannel
          file: ./abis/PaymentChannelABI.json
      eventHandlers:
        - event: ChannelOpened(indexed bytes32,indexed address,indexed address,address,uint8,uint256,uint256,uint256,uint256,address)
          handler: handleChannelOpened
        - event: ChannelActivated(indexed bytes32)
          handler: handleChannelActivated
        - event: SettlementInitiated(indexed bytes32,indexed address,uint256,uint256)
          handler: handleSettlementInitiated
        - event: ReceiptSubmitted(indexed bytes32,indexed address,uint256,uint256)
          handler: handleReceiptSubmitted
        - event: ChannelFinalized(indexed bytes32,uint256,uint256,bytes32)
          handler: handleChannelFinalized
      file: ./src/payment-channel.ts

  - kind: ethereum
    name: AttestationRegistry
    network: kite-ai-testnet
    source:
      address: "0x95b4e0e5A4F7d10F77f5FB4C1E9Ea3a5e0e5C5C1" # Updated with actual address when deployed
      abi: AttestationRegistry
      startBlock: 21096127
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Attestation
        - Validation
        - MerkleRoot
        - Agent
      abis:
        - name: AttestationRegistry
          file: ./abis/AttestationRegistry.json
      eventHandlers:
        - event: FeedbackGiven(indexed uint256,indexed address,indexed uint64,int128,uint8,string,string)
          handler: handleFeedbackGiven
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
        - event: ResponseAppended(indexed uint256,indexed address,indexed uint64)
          handler: handleResponseAppended
        - event: ValidationRequested(indexed bytes32,indexed uint256,indexed address,bytes32)
          handler: handleValidationRequested
        - event: ValidationResponded(indexed bytes32,indexed address,uint8,string)
          handler: handleValidationResponded
        - event: MerkleRootAnchored(indexed uint256,indexed bytes32,uint256,string,address)
          handler: handleMerkleRootAnchored
      file: ./src/attestation-registry.ts

templates:
  - kind: ethereum
    name: ClientVault
    network: kite-ai-testnet
    source:
      abi: ClientAgentVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - Session
        - SessionIndex
        - User
      abis:
        - name: ClientAgentVault
          file: ./abis/ClientAgentVaultABI.json
      eventHandlers:
        - event: TransferExecuted(indexed bytes32,indexed address,indexed address,uint256,bytes32,bytes)
          handler: handleTransferExecuted
      file: ./src/client-vault.ts

